<!doctype html>
<!--
  Netlify discovers forms by parsing the static HTML in a deploy. A CRA app
  renders its forms in the browser, so they are invisible to that parser —
  this file is the actual form definition. Keep its field names in sync with
  ContactMe.jsx, including the bot-field honeypot.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Airdrop form definition</title>
  </head>
  <body>
    <form name="airdrop-form" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="wallet-address" />
      <input type="text" name="suburb" />
      <input type="text" name="mailing-list" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
