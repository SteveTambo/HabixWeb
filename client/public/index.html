<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b10" />

    <link rel="icon" href="%PUBLIC_URL%/hbxlogo-192.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/hbxlogo.png" />

    <!-- Title, description and canonical are per-route via the <Seo> component
         (src/components/Seo.jsx) using react-helmet-async — this default
         title only paints for the instant before React hydrates. -->
    <title>
      Habix Technologies | Powering Digital Transformation Through Blockchain
      Innovation
    </title>
    <meta
      name="keywords"
      content="Digital Transformation, Business Process Automation, Consulting, blockchain, Africa, Venture Studio, property rentals"
    />

    <!-- Social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Habix Technologies" />
    <meta property="og:title" content="Habix Technologies" />
    <meta
      property="og:description"
      content="Powering digital transformation through blockchain innovation."
    />
    <meta
      property="og:image"
      content="https://www.habixgroup.top/img/hbxlogo.png"
    />
    <meta property="og:image:width" content="2975" />
    <meta property="og:image:height" content="2975" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="https://www.habixgroup.top" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Habix Technologies" />
    <meta
      name="twitter:description"
      content="Powering digital transformation through blockchain innovation."
    />
    <meta
      name="twitter:image"
      content="https://www.habixgroup.top/img/hbxlogo.png"
    />

    <!-- Fonts: one display face, one text face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
